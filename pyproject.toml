[project]
name = "maatlog"
version = "0.0.0"
description = "A Sphinx extension that turns documentation projects into static blogs."
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "usaturn" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Framework :: Sphinx :: Extension",
]
dependencies = ["Sphinx>=9.1", "myst-parser>=5.1", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/usaturn/maatlog"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "sphinx-autobuild",
    "wabun-rst-ulint",
    "playwright>=1.62.0",
]

# Keep every path in this file present in both layouts: this file is shared with the
# public repository, where tools/public_sync does not exist. The parent-side sync
# tests are passed to pytest explicitly by scripts/ci/verify.sh.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "browser: requires npm ci and an installed Playwright Chromium browser",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]


[tool.ruff]
target-version = "py314"
# ruff 既定の除外リストを保ちつつ追加する（公式は exclude ではなく extend-exclude を推奨）
# .venv と .ruff_cache は既定に含まれるため個別指定は不要
extend-exclude = [
    "*.md",    # ruff 0.16+ は Markdown 内コードブロックを整形するため除外
]
line-length = 119

[tool.ruff.lint]
select = [
    "F", # Flake8
    "B", # Black
    "I", # isort
    "E", # error
    "W"  # warning
]
ignore = []
fixable = ["ALL"]

# 自動フォーマット設定
[tool.ruff.format]
#quote-style = "double"
#indent-style = "space"
#skip-magic-trailing-comma = false
line-ending = "auto"
